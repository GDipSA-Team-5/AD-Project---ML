# Pytest configuration for running tests
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--cov=.",
    "--cov-report=xml",
    "--cov-report=term-missing"
]

# Coverage configuration
[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
]
