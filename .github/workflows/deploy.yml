name: Build and deploy container app to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Log in to Azure Container Registry
    - name: Login to ACR
      uses: docker/login-action@v3
      with:
        registry: YOUR_ACR_LOGIN_SERVER # e.g., myregistry.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}
    
    # Build and push the Docker image
    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: in5nite.azurecr.io/ad-ml-flask:latest # e.g., myregistry.azurecr.io/mywebapp:latest

    # Deploy to Azure App Service
#    - name: Deploy to Azure Web App
#      uses: azure/webapps-deploy@v2
#      with:
#        app-name: YOUR_WEBAPP_NAME # e.g., zenith-portal-web
#        publish-profile: #$#{{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }} # Or use OIDC
#        images: 'in5nite.azurecr.io/ad-ml-flask:latest'