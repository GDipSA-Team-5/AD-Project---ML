name: Build and deploy container app to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
    - uses: actions/checkout@v4

    # Log in to Azure Container Registry
    - name: Login to ACR
      uses: docker/login-action@v3
      with:
        registry: in5nite.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # Build the Docker image
    - name: Build image
      run: docker build -t in5nite.azurecr.io/ad-ml-flask:latest .

    # Test the Docker container
    - name: Run container for health check
      run: |
        docker run -d -p 8000:8000 --name ad-ml-flask-test in5nite.azurecr.io/ad-ml-flask:latest
        sleep 10
        curl -f http://localhost:8000/health
        docker stop ad-ml-flask-test || true
        docker rm ad-ml-flask-test || true

    # Push the image to ACR
    - name: Push image to ACR
      run: docker push in5nite.azurecr.io/ad-ml-flask:latest

    # Log in to Azure using OIDC
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # Deploy to Azure Web App
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: in5nite-ml
        images: 'in5nite.azurecr.io/ad-ml-flask:latest'
