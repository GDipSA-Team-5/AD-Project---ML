name: CI - ML Service

on:
  push:
    branches:
      - main 
  pull_request:
  workflow_dispatch:

jobs:
  # Run unit tests and SonarCloud code quality scan
  sonar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Build Docker image
        run: |
          docker build -t ml-service:test .

      - name: Run container
        run: |
          docker run -d --rm --name ml-service-sonar -p 8000:8000 ml-service:test

      # Health check
      - name: Wait for service health check
        run: |
          echo "Waiting for service to become healthy..."
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "Service is healthy"
              exit 0
            fi
            echo "Attempt $i/30: Service not ready yet..."
            sleep 2
          done
          echo "Service failed to become healthy"
          docker logs ml-service-sonar
          exit 1

      - name: Run tests with coverage
        env:
          BASE_URL: http://localhost:8000
        run: |
          pytest --cov=. --cov-report=xml

      - name: Stop container
        if: always()
        run: |
          docker stop ml-service-sonar || true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@eb211723266fe8e83102bac7361f0a05c3ac1d1b  # v3.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=GDipSA-Team-5_AD-Project---ML
            -Dsonar.organization=gdipsa-team-5
            -Dsonar.python.coverage.reportPaths=coverage.xml

  # DAST scan
  zap-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      checks: write
      issues: write
    
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Build Docker image
        run: |
          docker build -t ml-service:zap .

      - name: Run container
        run: |
          docker run -d --rm --name ml-service-zap -p 8000:8000 ml-service:zap

      - name: Wait for service to be ready
        run: |
          echo "Waiting for service to become healthy..."
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "Service is healthy"
              exit 0
            fi
            echo "Attempt $i/30: Service not ready yet..."
            sleep 2
          done
          echo "Service failed to become healthy"
          docker logs ml-service-zap
          exit 1
      
      - name: Workspace permissions for ZAP
        run: sudo chmod -R a+w .

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@6f7e0e5ea584ec3622f83fb4b9c3134f9c5c4f76  # v0.12.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -r zap-report.html -w zap-report.md -J zap-report.json'

      - name: Upload ZAP scan report
        if: always()
        uses: actions/upload-artifact@4cbc4cef8f63c9b2e7b17c52d2436abe2ce2f011  # v4.6.0
        with:
          name: zap-scan-report
          path: |
            zap-report.html
            zap-report.md
            zap-report.json

      - name: Stop container
        if: always()
        run: |
          docker stop ml-service-zap || true

  # snyk scan
  snyk-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Snyk dependency scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >
            --severity-threshold=high
            --sarif-file-output=snyk-python.sarif
            --monitor

      - name: Upload Snyk results to GitHub Security
        uses: github/codeql-action/upload-sarif@48ab28a6f5dbc2c513cdcb5b6faf43bc4089a862  # v3.28.0
        if: always()
        with:
          sarif_file: snyk-python.sarif

      - name: Build Docker image for Snyk
        run: docker build -t ad-ml-service:snyk .

      - name: Snyk container scan
        uses: snyk/actions/docker@master 
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ad-ml-service:snyk
          sarif: true 
          args: >
            --file=Dockerfile 
            --severity-threshold=high
            --monitor
