name: CI - ML Service

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest --cov=. --cov-report=xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=GDipSA-Team-5_AD-Project---ML
            -Dsonar.organization=gdipsa-team-5
            -Dsonar.python.coverage.reportPaths=coverage.xml

  integration-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ml-service:test .

      - name: Run container
        run: |
          docker run -d --rm --name ml-service-test -p 8000:8000 ml-service:test

      - name: Wait for service health check
        run: |
          echo "Waiting for service to become healthy..."
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "Service is healthy"
              exit 0
            fi
            echo "Attempt $i/30: Service not ready yet..."
            sleep 2
          done
          echo "Service failed to become healthy"
          docker logs ml-service-test
          exit 1

      - name: Test /health endpoint
        run: |
          curl -v http://localhost:8000/health

      - name: Stop container
        if: always()
        run: |
          docker stop ml-service-test || true

  dependency-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: OWASP Dependency-Check (SCA)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "AD-Project-ML"
          path: "."
          format: "ALL"
          out: "dependency-check-report"
          args: >
            --enableExperimental
            --suppression dependency-check-suppressions.xml

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report

  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ml-service:${{ github.sha }} .

      - name: Trivy scan - Docker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ml-service:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'

      - name: Trivy scan - Filesystem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
